project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - analysis/analysis_pilot.qmd
    - analysis/analysis_exp1.qmd
    - analysis/analysis_exp2.qmd
    - analysis/analysis_exp3.qmd

website:
  title: "Task Timing and Preference"
  description: "Analysis companion for four studies of task timing and preference"
  repo-url: "https://github.com/pmarcowski/task-timing-preference"
  repo-actions: [source]
  search: true
  navbar:
    title: "Task Timing & Preference"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Analysis"
        menu:
          - text: "Pilot Study"
            href: analysis/analysis_pilot.qmd
          - text: "Experiment 1"
            href: analysis/analysis_exp1.qmd
          - text: "Experiment 2"
            href: analysis/analysis_exp2.qmd
          - text: "Experiment 3"
            href: analysis/analysis_exp3.qmd
    right:
      - icon: github
        href: "https://github.com/pmarcowski/task-timing-preference"
        aria-label: "Source repository"
  page-footer:
    left: "© 2026 Przemysław Marcowski"
    right:
      - text: "Source"
        href: "https://github.com/pmarcowski/task-timing-preference"
      - text: "License"
        href: LICENSE

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    anchor-sections: true
    code-copy: true
    link-external-newwindow: true
    smooth-scroll: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">

execute:
  freeze: true
